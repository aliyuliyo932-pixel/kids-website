<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="form.css" />
</head>

<body>
  <div class="form_card">
    <h2 class="header">Create account</h2>
    <div>
      <label class="lable" for="fname">Your Name</label>
      <div class="name_input">
        <input type="text" id="fname" placeholder="first name" />
        <input type="text" id="lname" placeholder="last name" />
      </div>
    </div>
    <div class="email_input">
      <label for="email">Your Email</label>
      <div class="">
        <input type="email" id="email" placeholder="email" />
      </div>
    </div>
    <div class="Username_input">
      <label for="Username">Your Username</label>
      <div class="">
        <input type="Username" id="Username" placeholder="Username" />
      </div>
    </div>
    <div class="Password_input">
      <label for="Password">Your Password</label>
      <div class="">
        <input type="password" id="password" placeholder="### ###" />
      </div>
    </div>
    <div class="flex_inputs">
      <div class="gender_input">
        <label for="gender">Gender</label>
        <select class="gender">
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
      <div class="birthday_col">
        <label for="fname">Birthday</label>
        <div class="birthday_input">
          <input type="number" id="dayInput" min="1" max="31" step="1" placeholder="Day" />
          <input type="number" id="monthInput" min="1" max="12" step="1" placeholder="Month" />
          <input type="number" id="yearInput" min="1900" max="2100" step="1" placeholder="Year" />
        </div>
      </div>
    </div>
  </div>
  <form>

    <!-- Your other inputs go here -->

    <div class="terms">
      <input type="checkbox" id="terms" required>
      <label for="terms">
        Agree with <a href="#">Term & Conditions</a>
      </label>
    </div>

    <button type="submit">Create Account</button>

    <p class="login-link">
      Already have an account?
      <a href="login.html">Login to Account</a>
    </p>

  </form>
</body>

</html>
